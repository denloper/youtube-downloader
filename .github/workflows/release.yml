name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v1.1.0. Leave empty to only build an artifact without publishing a release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean YouTubeDownloader.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-exe
          path: dist/YouTubeDownloader.exe
          if-no-files-found: error

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: YouTube Downloader ${{ steps.rel.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/YouTubeDownloader.exe
